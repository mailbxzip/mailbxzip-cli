; Archiver un exercice précis au format mbox, réimportable dans un client
; de messagerie (Thunderbird, mutt...).
;
; since est inclusive, before est exclusive : cet exemple couvre exactement
; l'année civile 2023.
;
;   php cli.php mailbox --start archive-exercice-mbox

address = "utilisateur@exemple.fr"

in  = Imap
out = Mbox

; Ancienne chaîne de connexion, toujours comprise.
server   = "{imap.exemple.fr:993/imap/ssl}"
username = "utilisateur@exemple.fr"
password = "a-remplacer"

since  = "2023-01-01"
before = "2024-01-01"
