; Archiver un compte Gmail par l'API Google — sans IMAP, sans mot de passe.
;
; Mise en route, une seule fois (libellés de l'interface actuelle) :
;
;   1. console.cloud.google.com : créez un projet, puis
;      APIs & Services > Library > Gmail API > Enable.
;   2. Google Auth Platform > Branding : nom de l'application et adresse
;      d'assistance.
;   3. Google Auth Platform > Audience : type « External », ajoutez votre
;      adresse comme utilisateur test, puis cliquez « Publish app ».
;      ⚠ En statut « Testing », Google fait expirer le jeton au bout de
;      7 JOURS. Publiée, il n'expire plus.
;   4. Google Auth Platform > Clients > Create Client, type « Desktop app ».
;      Reportez client_id et client_secret ci-dessous.
;   5. Lancez : php cli.php gmail-auth gmail
;      Un avertissement « application non validée » apparaît : c'est normal
;      pour un usage personnel, développez « Paramètres avancés » et
;      poursuivez. Google renvoie l'autorisation à la commande, rien à
;      recopier, et le refresh_token est écrit ici.
;
;      En SSH, le navigateur ne peut pas joindre la boucle locale du serveur :
;      utilisez « gmail-auth gmail --paste » et collez l'adresse sur laquelle
;      le navigateur a échoué, ou redirigez un port fixe avec --port.
;
;   php cli.php mailbox --start gmail

address = "utilisateur@gmail.com"

in  = Gmail
out = Eml

; --- Identifiants OAuth ------------------------------------------------------
client_id     = "a-remplacer.apps.googleusercontent.com"
client_secret = "a-remplacer"
; Écrit par « gmail-auth » :
; refresh_token = "..."

; --- Ce qui est archivé ------------------------------------------------------
; Par défaut : « [Gmail]/All Mail », c'est-à-dire TOUS les messages, une fois
; chacun, dans un seul dossier.
;
; Gmail n'a pas de dossiers mais des libellés, et un message en porte
; plusieurs. Archiver chaque libellé reviendrait donc à archiver le même
; message autant de fois qu'il a de libellés — d'où ce choix par défaut.
;
; Pour retrouver l'arborescence de vos libellés, nommez-les. Un message
; apparaîtra alors sous chacun de ceux qu'il porte :
;
;   folders = "INBOX, Clients, [Gmail]/Sent Mail"
;
; « php cli.php folders gmail » liste les libellés du compte.

; --- Filtres (facultatifs) ---------------------------------------------------
; Identiques aux autres connecteurs, et poussés côté Google :
; before = "-2 years"
; from   = "bulletin@exemple.fr"

; --- Suppression (facultative) -----------------------------------------------
; L'autorisation demandée s'ajuste : lecture seule tant qu'aucune de ces clés
; n'est présente. En ajouter une APRÈS coup oblige à relancer « gmail-auth »
; pour obtenir l'accès en écriture.
;
; Gmail distingue les deux, sans les contorsions d'IMAP :
;   trash  = 1     déplace vers la corbeille Gmail (récupérable 30 jours)
;   delete = 1     supprime définitivement
