; Archiver un compte Gmail par l'API Google — sans IMAP, sans mot de passe.
;
; Mise en route, une seule fois :
;   1. Créez un projet sur console.cloud.google.com, activez l'API Gmail.
;   2. Créez un identifiant OAuth de type « Application de bureau ».
;   3. Reportez client_id et client_secret ci-dessous.
;   4. Lancez : php cli.php gmail-auth gmail
;      La commande affiche un lien, vous autorisez, vous collez le code,
;      elle écrit le refresh_token dans ce fichier. Il n'expire pas.
;
;   php cli.php mailbox --start gmail

address = "utilisateur@gmail.com"

in  = Gmail
out = Eml

; --- Identifiants OAuth ------------------------------------------------------
client_id     = "a-remplacer.apps.googleusercontent.com"
client_secret = "a-remplacer"
; Écrit par « gmail-auth » :
; refresh_token = "..."

; --- Ce qui est archivé ------------------------------------------------------
; Par défaut : « [Gmail]/All Mail », c'est-à-dire TOUS les messages, une fois
; chacun, dans un seul dossier.
;
; Gmail n'a pas de dossiers mais des libellés, et un message en porte
; plusieurs. Archiver chaque libellé reviendrait donc à archiver le même
; message autant de fois qu'il a de libellés — d'où ce choix par défaut.
;
; Pour retrouver l'arborescence de vos libellés, nommez-les. Un message
; apparaîtra alors sous chacun de ceux qu'il porte :
;
;   folders = "INBOX, Clients, [Gmail]/Sent Mail"
;
; « php cli.php folders gmail » liste les libellés du compte.

; --- Filtres (facultatifs) ---------------------------------------------------
; Identiques aux autres connecteurs, et poussés côté Google :
; before = "-2 years"
; from   = "bulletin@exemple.fr"

; --- Suppression (facultative) -----------------------------------------------
; Gmail distingue les deux, sans les contorsions d'IMAP :
;   trash  = 1     déplace vers la corbeille Gmail (récupérable 30 jours)
;   delete = 1     supprime définitivement
