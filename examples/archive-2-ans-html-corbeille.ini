; Archiver en HTML les e-mails de plus de deux ans, PUIS LES DÉPLACER
; DANS LA CORBEILLE du serveur.
;
; Variante prudente de archive-2-ans-html-purge.ini : les messages quittent
; leurs dossiers d'origine mais restent récupérables tant que la corbeille
; n'est pas vidée. C'est la configuration à préférer pour une première purge.
;
;   php cli.php mailbox --start archive-2-ans-html-corbeille

address = "utilisateur@exemple.fr"

in  = Imap
out = Html

; --- Connexion ---------------------------------------------------------------
host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; --- Fenêtre de dates --------------------------------------------------------
before = "-2 years"

wSource = 1

; --- Suppression via la corbeille --------------------------------------------
delete = 1

; "1" laisse l'outil trouver la corbeille : il interroge le serveur, qui la
; désigne le plus souvent lui-même (attribut SPECIAL-USE \Trash), et se rabat
; sinon sur les noms usuels (Trash, Corbeille, Deleted Items...).
trash = 1

; Si la détection échoue, l'export s'arrête sans rien supprimer et il suffit
; de nommer le dossier :
;   trash = "INBOX.Trash"
;   trash = "INBOX/Corbeille"
