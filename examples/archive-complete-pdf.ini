; Archiver l'intégralité d'une boîte en PDF, un document par message,
; pièces jointes embarquées dans le document.
;
; Aucune fenêtre de dates : toute la boîte est exportée.
;
;   php cli.php mailbox --start archive-complete-pdf

address = "utilisateur@exemple.fr"

in  = Imap
out = Pdf

host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; Conserver le .eml d'origine : un PDF est lisible, un .eml est réimportable.
wSource = 1
