; Archiver tout ce qu'a envoyé un expéditeur, quelle que soit l'année.
;
; Le cas typique : désengorger une boîte d'un bulletin ou d'un émetteur
; automatique qui l'encombre depuis des années.
;
;   php cli.php mailbox --start archive-expediteur

address = "utilisateur@exemple.fr"

in  = Imap
out = Eml

; --- Connexion ---------------------------------------------------------------
host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; --- Filtre par expéditeur ---------------------------------------------------
; Recherche une sous-chaîne dans l'en-tête From, sans tenir compte de la casse :
; une adresse complète, un domaine, ou un nom affiché font également l'affaire.
;
;   from = "bulletin@exemple.fr"     une adresse précise
;   from = "@newsletter.fr"          tout un domaine
;   from = "Alice"                   un nom affiché
;
; Plusieurs expéditeurs se séparent par des virgules ; il suffit qu'un seul
; corresponde.
from = "bulletin@exemple.fr, notifications@exemple.fr"

; Aucune fenêtre de dates : toutes les années sont prises. Les deux filtres se
; combinent si vous en ajoutez une, et se restreignent l'un l'autre :
;   before = "-2 years"    ce même expéditeur, mais seulement au-delà de 2 ans

; --- Suppression -------------------------------------------------------------
; Une fois l'archive vérifiée, décommentez pour vider la boîte de ces messages.
; Seuls ceux qui correspondent au filtre sont concernés.
; delete = 1
