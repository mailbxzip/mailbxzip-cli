; Exemple simple — archiver une boîte IMAP.
;
; Tel quel : toute la boîte est exportée en fichiers .eml, et RIEN n'est
; supprimé. Les variantes courantes sont en commentaire plus bas, il suffit
; de décommenter.
;
;   cp examples/imap-simple.ini ~/.config/mailbxzip/config/ma-boite
;   cd cli && php cli.php mailbox --start ma-boite

; Adresse de la boîte. Donne son nom au dossier d'archive, et sert à
; reconnaître les messages que vous avez envoyés.
address = "utilisateur@exemple.fr"

; --- Source ------------------------------------------------------------------
in = Imap

host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; --- Format de sortie --------------------------------------------------------
; Eml   un fichier .eml par message : le message d'origine, octet pour octet,
;       réimportable dans n'importe quel client de messagerie.
; Html  une archive navigable : une page par message, un index par dossier,
;       pièces jointes liées. Se lit avec un simple navigateur.
out = Eml
; out = Html

; --- Suppression de la source ------------------------------------------------
; Désactivée. Décommentez UNE des deux variantes pour vider la boîte au fur
; et à mesure qu'elle est archivée.
;
; La suppression n'intervient qu'une fois l'archive ZIP écrite, et ne porte
; que sur les messages effectivement archivés.

;   Variante prudente : les messages partent à la corbeille du serveur,
;   d'où ils restent récupérables. "trash" suffit, "delete" est inutile.
; trash = 1

;   Variante définitive : les messages sont effacés, sans filet.
; delete = 1

; --- Options utiles ----------------------------------------------------------
; N'archiver que les messages de plus de deux ans (date d'envoi) :
; before = "-2 years"

; Conserver aussi le .eml d'origine à côté du format choisi. Sans objet si
; out = Eml, utile avec Html ou Pdf :
; wSource = 1
