; Archiver en HTML les e-mails de plus de deux ans, PUIS LES SUPPRIMER
; du serveur.
;
; ATTENTION : cette configuration efface des messages, sans retour possible.
; Ne l'utiliser qu'après avoir exécuté archive-2-ans-html.ini et vérifié
; l'archive produite. Lire la section « Purger la boîte » du README.
;
;   php cli.php mailbox --start archive-2-ans-html-purge

address = "utilisateur@exemple.fr"

in  = Imap
out = Html

; --- Connexion ---------------------------------------------------------------
host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; --- Fenêtre de dates --------------------------------------------------------
; Seuls les messages de plus de deux ans sont concernés, par l'archivage comme
; par la suppression : ce qui est hors fenêtre n'est jamais touché.
before = "-2 years"

; Le .eml d'origine est conservé : puisque la source va disparaître, autant
; garder le message brut en plus de sa mise en page.
wSource = 1

; --- Suppression -------------------------------------------------------------
; N'intervient qu'une fois l'archive ZIP écrite sur le disque, et uniquement
; pour les messages effectivement archivés.
delete = 1
