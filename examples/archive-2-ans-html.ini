; Archiver en HTML les e-mails de plus de deux ans, SANS rien supprimer.
;
; La boîte n'est pas modifiée : c'est la configuration à utiliser en premier,
; pour vérifier le résultat avant d'envisager une purge.
;
;   php cli.php mailbox --start archive-2-ans-html

address = "utilisateur@exemple.fr"

in  = Imap
out = Html

; --- Connexion ---------------------------------------------------------------
host          = "imap.exemple.fr"
port          = 993
encryption    = "ssl"
validate_cert = 1
username      = "utilisateur@exemple.fr"
password      = "a-remplacer"

; --- Fenêtre de dates --------------------------------------------------------
; "-2 years" est recalculé à chaque exécution : la borne suit le temps, ce qui
; convient à une tâche planifiée. Seuls les messages ENVOYÉS avant cette date
; sont archivés. Rien n'est supprimé.
before = "-2 years"

; Conserver aussi le .eml d'origine à côté de chaque page HTML.
wSource = 1
