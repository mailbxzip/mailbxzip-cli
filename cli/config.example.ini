; Configuration example for Mailbxzip -- one file per mailbox.

address = "test@mailbxzip.com"

; Input Type
; Class handling input operations, from src/In.
;   Imap        default IMAP connector, needs no PHP extension
;   ImapLegacy  DEPRECATED, uses ext-imap which PHP removed from core in 8.4
;   Test        fixed set of messages, to try the tool out offline
in = Test

; Output Format
; Class handling output operations, from src/Out.
;   Pdf   one document per message, attachments embedded
;   Eml   one raw .eml file per message
;   Mbox  one mbox file per folder
;   Test  dry run, writes nothing
out = Test

; --- IMAP connection (in = Imap) -------------------------------------------
; Either the explicit keys:
;   host = "ssl0.ovh.net"
;   port = 993
;   encryption = "ssl"        ; ssl (default), tls, starttls or none
;   validate_cert = 1
; or the legacy ext-imap string, still understood:
server = "{ssl0.ovh.net:993/imap/ssl}"
username = "test@mailbxzip.com"
; Avoid storing the password here: prefer an environment variable.
password = "MyPassword@2025"

; --- Optional --------------------------------------------------------------
; Restrict the export to the messages sent within a window.
; since is inclusive, before is exclusive.
;   since = "2024-01-01"
;   before = "2025-01-01"

; Keep the raw .eml source of every message alongside the chosen format.
;   wSource = 1

; Keep the intermediate HTML next to each PDF, to investigate a layout issue.
;   debugHtml = 1
